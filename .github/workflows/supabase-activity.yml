name: Controllo attività Supabase

on:
  schedule:
    # Four checks daily, away from the top of the hour (UTC).
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/supabase-activity.yml'

permissions:
  contents: read

jobs:
  database-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify database query
        env:
          PROJECT_URL: https://xgtreqiunwbiqihfxoiv.supabase.co
          PUBLISHABLE_KEY: sb_publishable_G4RLkHY1-S5G2URiyU8NtA_TLKHps19
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 25 \
            -X POST "$PROJECT_URL/rest/v1/rpc/expense_healthcheck" \
            -H "apikey: $PUBLISHABLE_KEY" \
            -H 'Content-Type: application/json' \
            --data '{}')
          if [[ "$response" != '1' ]]; then
            echo "The health check returned an unexpected response: $response" >&2
            exit 1
          fi
          echo 'Supabase database responded successfully.'
